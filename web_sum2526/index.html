    <h1>Web 1 Course: Summer 2025-2026 Pages</h1>

    <nav class="flex-container">
        <ul id="fileList"></ul>
    </nav>

    <script>
        const owner = "nazeehgh";
        const repo = "web1";
        const path = "web_sum2526";   // folder containing HTML files
        const branch = "main";

        fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`)
    .then(response => response.json())
    .then(files => {
        const list = document.getElementById("fileList");

        files
            .filter(file => file.name.toLowerCase().endsWith(".html"))
            .sort((a, b) => a.name.localeCompare(b.name))
            .forEach(file => {

                // Read the HTML file content
                fetch(file.download_url)
                    .then(response => response.text())
                    .then(html => {

                        // Extract <title>
                        const match = html.match(/<title>(.*?)<\/title>/i);

                        const pageTitle = match 
                            ? match[1] 
                            : file.name.replace(".html", "");

                        const li = document.createElement("li");
                        const a = document.createElement("a");

                        // Link to GitHub Pages page
                        a.href = file.name;

                        // Display page title instead of file name
                        a.textContent = pageTitle;

                        li.appendChild(a);
                        list.appendChild(li);

                    });
            });
    })
    .catch(err => console.error(err));
