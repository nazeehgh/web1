<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables 02</title>

    <style>
        table {
            width: 80%;
            border: 1px solid black;
            /* border-spacing: 0px; */
            /* border-collapse: collapse; */
            /* border-radius: 20px; */
            border-color: red;

        }

        td,
        th {
            border: 3px inset green;
            /* border-radius: 20px; */
/* padding: 10px;
padding: 10px 40px 20px 30px; */

            padding-top: 10px;
  padding-bottom: 20px;
  padding-left: 30px;
  padding-right: 40px;


        }

        table,
        td,
        th {
            border-radius: 10px;
        }

        tr:nth-child(odd){
            background-color: yellow;
        }

        td:nth-child(odd), th:nth-child(odd) {
  background-color: #D6EEEE;
}
    </style>

</head>

<body>
    <table>
        <caption>This is my table</caption>

        <tr>
            <th>1</th>
            <th>2</th>
            <th>3</th>
            <th style="width: 100px;">4</th>
            <th>5</th>
        </tr>
        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
            <td style="width: 100px;">4</td>
            <td>5</td>
        </tr>
        <tr style="height: 60px;">
            <td>1</td>
            <td>2</td>
            <td style="background-color: aquamarine;">3</td>
            <td>4</td>
            <td>5</td>
        </tr>
        <tr>
            <td style="height: 200px;">1</td>
            <td>2</td>
            <td>3</td>
            <td>4</td>
            <td>5</td>
        </tr>
        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
            <td>4</td>
            <td>5</td>
        </tr>
        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
            <td>4</td>
            <td>5</td>
        </tr>

    </table>


  
</body>

</html>
