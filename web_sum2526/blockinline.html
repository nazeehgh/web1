<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Inline</title>
    <style>
        span, div{
            background-color: yellowgreen;
        }

        div p{
            background-color: red;
        }

    </style>
</head>
<body>

    <p>
        Lorem ipsum, dolor sit <span>this is my span</span>amet consectetur adipisicing elit. Soluta quidem ex ea numquam qui hic cumque nulla odio maxime ipsum.
    </p>
    <div>
        123
        <p>this is p inside div</p>
    </div>
    
</body>
</html>
