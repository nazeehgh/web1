<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Local and Global Variables</title>
</head>
<body>

    <div id="d1"></div>

    <script>
        var x = 10; // Global variable

        function fun1() {

            x = 15; // Modify global variable
            // var x = 15; // Create local variable
            var y = 20; // Local variable
            document.getElementById("d1").innerText = "Inside fun1 - x: " + x + ", y: " + y; 
            // console.log("Inside fun1 - x: " + x + ", y: " + y);
        }

        function fun2() {
            try{
            document.getElementById("d1").innerText += "\n Inside fun2 - x: " + x + ", y: " + y; 
            // console.log("Inside fun2 - x: " + x);
            // console.log("Inside fun2 - y: " + y); // This will cause an error because y is not defined in this scope
            } catch (error) {
                document.getElementById("d1").innerText += "\nError: " + error.message;
            }
        }
        fun1();
        fun2();
    </script>
    
</body>
</html>
