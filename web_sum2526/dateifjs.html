<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Date IF</title>
</head>
<body>

<div id="d1"></div>

<script>

const d = new Date();

document.getElementById('d1').innerHTML =
 d.getHours() + ":" + d.getMinutes() + ":" + d.getSeconds();

if(d.getHours() > 12)
document.getElementById('d1').innerHTML = "Good Afternoon";
else
document.getElementById('d1').innerHTML = "Good Morning";

// } else {
//     document.getElementById("d1").innerText = "Good afternoon!";
// }

</script>
    
</body>
</html>
