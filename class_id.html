<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class and ID</title>
    <style>

        /* https://fontawesome.com/ */
       
          .col1{
            background-color: blueviolet;
            color: aqua;
        }

        .col2{
            background-color: brown; 
        }
        .textr{
            /* color: red !important; */
            color: red;
            font-size: 30px;
        }

        #myelement1{
            color:chocolate;
            font-size: larger;
        }

       
    </style>
</head>
<body>

     <a href="#">Link 1</a>
    <p>this is p 1 &#128513;</p>
    <div class="textr">div 1</div>
    <div id="myelement1">div 2</div>
    <p class="col1 textr">this is p 2</p>
    <p>this is p 3</p>
    <a class="col1" href="#">Link 2</a>
    
</body>
</html>
